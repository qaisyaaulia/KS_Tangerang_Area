<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta GeoJSON Tangerang</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
        }
        
        #map {
            height: 100%;
            width: 100%;
            z-index: 1;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 60px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
            transition: transform 0.3s ease;
        }

        .header:hover {
            transform: translateY(-2px);
        }

        .header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #2c3e50;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .popup-container {
            font-family: 'Inter', sans-serif;
        }

        .popup-title {
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #3498db;
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .popup-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .popup-table th, .popup-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #f0f0f0;
            text-align: left;
        }

        .popup-table th {
            color: #7f8c8d;
            font-weight: 500;
            white-space: nowrap;
            width: 40%;
        }

        .popup-table td {
            color: #34495e;
            font-weight: 500;
        }

        .popup-table tr:last-child th,
        .popup-table tr:last-child td {
            border-bottom: none;
        }

        .popup-table tr:hover {
            background-color: #f8f9fa;
        }
        
        /* Custom scrollbar for popup */
        .leaflet-popup-content {
            max-height: 300px;
            overflow-y: auto;
            margin: 15px !important;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
        }
        
        .leaflet-popup-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .leaflet-popup-content::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        
        .leaflet-popup-content::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }

        .leaflet-popup-content::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Peta Area of Interest Tangerang</h1>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Initialize map, center on Tangerang area
        const map = L.map('map', {
            zoomControl: false // We will move it below the header
        }).setView([-6.1783, 106.6319], 11);

        L.control.zoom({
            position: 'topright'
        }).addTo(map);

        // Add OpenStreetMap basemap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Function to create HTML table from feature properties
        function createPopupContent(feature) {
            let html = '<div class="popup-container">';
            
            // Try to find a good title from properties (like name or type)
            const title = feature.properties.name || feature.properties.amenity || feature.properties.osm_type || 'Detail Objek';
            html += `<h3 class="popup-title">${title.charAt(0).toUpperCase() + title.slice(1)}</h3>`;

            if (!feature.properties || Object.keys(feature.properties).length === 0) {
                html += '<div style="padding: 10px; color: #7f8c8d;">Tidak ada atribut</div></div>';
                return html;
            }

            html += '<table class="popup-table"><tbody>';
            for (const key in feature.properties) {
                const value = feature.properties[key];
                // Only show properties that have a value
                if (value !== null && value !== '') {
                    // Make key more readable
                    const cleanKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    html += `<tr><th>${cleanKey}</th><td>${value}</td></tr>`;
                }
            }
            html += '</tbody></table></div>';
            return html;
        }

        // Common onEachFeature function to bind popup
        function onEachFeature(feature, layer) {
            const popupContent = createPopupContent(feature);
            layer.bindPopup(popupContent, {
                maxWidth: 400,
                minWidth: 300,
                className: 'custom-popup'
            });
            
            // Add hover effect
            layer.on({
                mouseover: function(e) {
                    const layer = e.target;
                    if (layer.setStyle) {
                        layer.setStyle({
                            weight: 3,
                            color: '#e74c3c',
                            fillOpacity: 0.9
                        });
                    }
                },
                mouseout: function(e) {
                    if(this.options.style) {
                        aoiLayer.resetStyle(e.target);
                    }
                }
            });
        }

        // Layer styling
        const aoiStyle = {
            radius: 7,
            fillColor: "#3498db",
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
        };

        const boundaryStyle = {
            color: "#2c3e50",
            weight: 3,
            opacity: 0.8,
            fillColor: "#34495e",
            fillOpacity: 0.1,
            dashArray: '5, 10'
        };

        // Variable to keep track of layer for resetStyle
        let aoiLayer;

        // Load clipping boundary GeoJSON
        fetch('data/clipping_boundary.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                L.geoJSON(data, {
                    style: boundaryStyle,
                    onEachFeature: function(feature, layer) {
                        layer.bindPopup('<div class="popup-container"><h3 class="popup-title">Clipping Boundary</h3></div>');
                    }
                }).addTo(map);
            })
            .catch(error => console.warn('Peringatan: Gagal memuat clipping_boundary.geojson. Pastikan Anda menjalankan file ini melalui Web Server (Live Server), bukan langsung membukanya di browser (file://). Error:', error));

        // Load Area of Interest GeoJSON
        fetch('data/area_of_interest_tangerang.geojson')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(data => {
                aoiLayer = L.geoJSON(data, {
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, aoiStyle);
                    },
                    style: aoiStyle,
                    onEachFeature: onEachFeature
                }).addTo(map);
                
                // Fit map to the bounds of the loaded data
                map.fitBounds(aoiLayer.getBounds(), { padding: [50, 50] });
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Gagal memuat data GeoJSON. Karena aturan keamanan browser (CORS), Anda harus membuka file ini melalui Web Server Lokal (seperti ekstensi Live Server di VS Code atau Python HTTP Server), bukan dengan double-click file HTML ini.');
            });

    </script>
</body>
</html>
